name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "releases/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  build-and-test:
    name: Test pygeoml1000 with Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install non-python (homebrew) dependencies
        if: ${{ matrix.os == 'macOS-latest' }}
        run: |
          brew update
          brew install opencascade cgal gmp mpfr boost
      - name: Get dependencies and install pygeoml1000
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade .[test]

      - name: Set LEGEND1000_METADATA variable
        run: |
          echo "LEGEND1000_METADATA=$GITHUB_WORKSPACE/legend1000-metadata" >> $GITHUB_ENV
      # legend1000-metadata is public, so this also works in PRs from forks.
      - name: Clone legend1000-metadata
        uses: actions/checkout@v7
        with:
          repository: legend-exp/legend1000-metadata
          fetch-depth: 0
          path: ${{ env.LEGEND1000_METADATA }}

      - name: Run unit tests
        run: |
          python -m pytest

  test-coverage:
    name: Calculate and upload test coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set LEGEND1000_METADATA variable
        run: |
          echo "LEGEND1000_METADATA=$GITHUB_WORKSPACE/legend1000-metadata" >> $GITHUB_ENV
      # legend1000-metadata is public, so this also works in PRs from forks.
      - name: Clone legend1000-metadata
        uses: actions/checkout@v7
        with:
          repository: legend-exp/legend1000-metadata
          fetch-depth: 0
          path: ${{ env.LEGEND1000_METADATA }}

      - name: Generate Report
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade .[test]
          python -m pytest --cov=pygeoml1000 --cov-report=xml
      - name: Upload Coverage to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-docs:
    name: Build documentation
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set LEGEND1000_METADATA variable
        run: |
          echo "LEGEND1000_METADATA=$GITHUB_WORKSPACE/legend1000-metadata" >> $GITHUB_ENV
      # legend1000-metadata is public, so this also works in PRs from forks.
      - name: Clone legend1000-metadata
        uses: actions/checkout@v7
        with:
          repository: legend-exp/legend1000-metadata
          fetch-depth: 0
          path: ${{ env.LEGEND1000_METADATA }}

      - name: Setup build environment
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade .[docs]
      - name: Build docs for current ref
        run: |
          cd docs
          make clean
          make
